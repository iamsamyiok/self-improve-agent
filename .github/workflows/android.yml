name: build-android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.4.2 官方支持 Gradle 8.6-8.x；不固定会装上 Gradle 9.x 导致构建失败
          gradle-version: '8.7'

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_KEYPASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/hwj-mobile.jks"
            echo "SIGN_PROPS=-PMOBILE_STORE_FILE=$RUNNER_TEMP/hwj-mobile.jks -PMOBILE_STORE_PASSWORD=$KS_PASS -PMOBILE_KEY_ALIAS=$KS_ALIAS -PMOBILE_KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
          else
            echo "SIGN_PROPS=" >> "$GITHUB_ENV"
            echo "::warning::未配置正式签名 Secrets（MOBILE_KEYSTORE_B64 等四项），本次使用临时 debug 签名：可安装可使用，但与正式签名版本互不兼容，届时需卸载重装一次。"
          fi

      - name: Build release APK
        run: gradle -p android assembleRelease $SIGN_PROPS

      - name: Rename APK
        run: |
          VER=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle | cut -d'"' -f2)
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/HWJ-Agent-v${VER}.apk"

      - name: Publish to fixed Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Android APK（最新构建）
          body: |
            手机端安装包，始终保持最新版本。

            - 下载 APK 直接安装即可
            - 签名一致时可直接覆盖安装升级
            - 使用前提：手机安装并登录 Tailscale，与云 Windows 同一网络
            - 首次启动填写云 Windows 服务地址（如 http://100.x.y.z:3788）
          files: dist-apk/*.apk
          make_latest: true
