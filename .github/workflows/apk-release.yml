name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download nodejs-mobile prebuilt
        run: |
          curl -sL -o /tmp/njm.zip \
            https://github.com/janeasystems/nodejs-mobile/releases/download/nodejs-mobile-v0.3.3/nodejs-mobile-v0.3.3-android.zip
          mkdir -p /tmp/nodejs-mobile
          unzip -q /tmp/njm.zip -d /tmp/nodejs-mobile
          ls /tmp/nodejs-mobile
          test -f /tmp/nodejs-mobile/bin/arm64-v8a/libnode.so || { echo 'libnode.so 缺失'; exit 1; }

      - name: Sync project assets + LLM config
        env:
          LLM_CONFIG_JSON: ${{ secrets.LLM_CONFIG_JSON }}
        run: |
          if [ -n "$LLM_CONFIG_JSON" ]; then
            mkdir -p .data
            printf '%s' "$LLM_CONFIG_JSON" > .data/config.json
          fi
          bash android/copy-assets.sh /tmp/nodejs-mobile

      - name: Build APK (debug, self-sign)
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/hwj-agent-v${GITHUB_REF_NAME#v}.apk"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      - name: Upload artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hwj-agent-apk
          path: dist/*.apk
