plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 正式签名经 GitHub Actions Secrets 注入（固定 keystore 才能覆盖安装升级）；
// Secrets 缺失时回退 debug 临时签名——可安装可使用，换正式签名后需卸载重装一次
def ksFile = project.findProperty('MOBILE_STORE_FILE')
def ksPass = project.findProperty('MOBILE_STORE_PASSWORD')
def ksAlias = project.findProperty('MOBILE_KEY_ALIAS')
def ksKeyPass = project.findProperty('MOBILE_KEY_PASSWORD')

android {
    namespace = "com.hwj.agent"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.hwj.agent"
        minSdk = 24
        targetSdk = 34
        versionCode = 16
        // 2.0.0：架构换代——移除内嵌 Node 运行时（legacy-node-src/ 归档），转为云 Windows + Tailscale 远程壳
        versionName = "2.0.0"
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
