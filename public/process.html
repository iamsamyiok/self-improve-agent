<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>执行过程 - 双层 Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #1f2937; padding: 16px; }
  .topbar { position: fixed; top: 0; left: 0; right: 0; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 10px 18px; display: flex; align-items: center; gap: 12px; z-index: 10; }
  .topbar h1 { font-size: 14px; font-weight: 600; }
  .topbar .path { font-size: 11px; color: #9ca3af; font-family: Consolas, monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { font-size: 11px; color: #10b981; display: flex; align-items: center; gap: 5px; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 1.2s infinite; }
  .live.paused .dot { background: #9ca3af; animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  #content { max-width: 980px; margin: 56px auto 40px; }
  .task { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; }
  .task > h2 { font-size: 14px; color: #1d4ed8; border-left: 4px solid #3b82f6; padding-left: 10px; margin-bottom: 10px; }
  .task > h2 .clock { color: #9ca3af; font-weight: normal; font-size: 12px; margin-right: 6px; }
  .task > p { font-size: 13px; }
  .h3row { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; font-size: 13px; }
  .h3row .clock { color: #9ca3af; font-size: 11.5px; font-family: Consolas, monospace; }
  .h3row.tool { color: #4338ca; font-weight: 600; }
  .h3row.say { color: #059669; font-weight: 600; }
  .h3row.err { color: #b91c1c; font-weight: 600; }
  .p { font-size: 13px; margin: 4px 0 10px; }
  .resline { font-size: 12.5px; margin: 6px 0 8px; }
  .resline .ok { color: #059669; font-weight: 600; }
  .resline .fail { color: #b91c1c; font-weight: 600; }
  pre.code { background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 10px 14px; font-size: 12px; font-family: Consolas, "Courier New", monospace; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0 12px; max-height: 420px; overflow-y: auto; line-height: 1.55; }
  pre.code.json { max-height: 260px; }
  .empty { text-align: center; color: #9ca3af; padding: 80px 0; font-size: 13px; }
  .backtop { position: fixed; right: 20px; bottom: 24px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; }
</style>
</head>
<body>
<div class="topbar">
  <h1>📋 内层执行过程（完整记录）</h1>
  <span class="path" id="path"></span>
  <span class="live" id="live"><span class="dot"></span><span id="liveText">实时刷新</span></span>
</div>
<div id="content"><div class="empty">暂无执行记录。在主页面发送任务后，这里会按时间顺序显示每个任务的用户消息、内层回复、每次插件调用的完整入参与完整结果。</div></div>
<button class="backtop" id="backtop" onclick="window.scrollTo({top:0,behavior:'smooth'})">▲ 回到最新</button>
<script>
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// 轻量 Markdown 渲染：仅覆盖过程文件的格式（##/### 标题、```代码块、**粗体**、`行内码`、--- 分隔、✓/✗ 着色）
function inline(s) {
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code style="background:#eef2ff;border-radius:3px;padding:1px 5px;font-family:Consolas,monospace;font-size:12px;color:#4338ca">$1</code>')
    .replace(/✓/g, '<span class="ok">✓</span>')
    .replace(/✗/g, '<span class="fail">✗</span>');
}
function render(md) {
  const parts = md.split(/\n(?=---\n)/); // 每个任务一块
  let html = '';
  for (const part of parts) {
    if (!part.replace(/[\s\-]/g,'')) continue;
    const lines = part.split('\n');
    let block = '', inCode = false, codeBuf = [], codeCls = '', taskHtml = '', taskTitle = '';
    const flushCode = () => { if (codeBuf.length) taskHtml += `<pre class="code ${codeCls}">${esc(codeBuf.join('\n'))}</pre>`; codeBuf = []; };
    for (const line of lines) {
      if (line.startsWith('```')) {
        if (inCode) { flushCode(); inCode = false; }
        else { inCode = true; codeCls = line.slice(3).trim() === 'json' ? 'json' : ''; }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      if (/^## /.test(line)) {
        taskTitle = `<h2>${inline(line.slice(3))}</h2>`;
      } else if (/^### /.test(line)) {
        const t = line.slice(4);
        const clock = (t.match(/^(\d{2}:\d{2}:\d{2})/) || [,''])[1];
        const rest = t.replace(/^\d{2}:\d{2}:\d{2}\s*/, '');
        const cls = rest.startsWith('🔧') ? 'tool' : rest.startsWith('❌') ? 'err' : 'say';
        taskHtml += `<div class="h3row ${cls}">${clock ? `<span class="clock">${clock}</span>` : ''}<span>${inline(rest)}</span></div>`;
      } else if (/^\*\*结果\*\*/.test(line)) {
        taskHtml += `<div class="resline">${inline(line)}</div>`;
      } else if (line.trim() === '' || /^---+$/.test(line.trim())) {
        continue;
      } else {
        taskHtml += `<div class="p">${inline(line)}</div>`;
      }
    }
    if (inCode) flushCode();
    if (taskTitle || taskHtml) block = `<div class="task">${taskTitle}${taskHtml}</div>`;
    html += block;
  }
  return html || '';
}

let lastMtime = 0, stickBottom = true;
window.addEventListener('scroll', () => {
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 60;
  stickBottom = atBottom;
  document.getElementById('backtop').style.display = atBottom ? 'none' : 'block';
});

async function tick() {
  try {
    // v3.4.0：带上次 mtime 请求，服务端未变化时短路返回（跳过全文件读取与传输）
    const r = await fetch('/api/process' + (lastMtime ? '?mtime=' + lastMtime : ''));
    const d = await r.json();
    document.getElementById('path').textContent = d.path || '';
    if (d.changed === false) { /* 内容未变，仅同步运行状态 */ }
    else if (d.mtime !== lastMtime) {
      lastMtime = d.mtime;
      const html = render(d.content || '');
      if (html) document.getElementById('content').innerHTML = html;
    }
    const live = document.getElementById('live');
    if (d.running) { live.classList.remove('paused'); document.getElementById('liveText').textContent = '任务执行中'; }
    else { live.classList.add('paused'); document.getElementById('liveText').textContent = '实时刷新'; }
    if (stickBottom) window.scrollTo(0, document.body.scrollHeight);
  } catch { /* 服务重启中 */ }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
